syntax = "proto3";

package burst.v1;

service ControllerRpc {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc PollJob(PollJobRequest) returns (PollJobResponse);
  rpc ReportJobResult(ReportJobResultRequest) returns (ReportJobResultResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message JobSpec {
  string          command = 1;
  repeated string args    = 2;
}

message SubmitJobRequest {
  JobSpec spec = 1;
}

message SubmitJobResponse {
  string job_id = 1;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id = 1;
  string state  = 2;
}

message RegisterWorkerRequest {
  string worker_id = 1;
  uint32 slots     = 2;
}

message RegisterWorkerResponse {
  bool accepted = 1;
}

message PollJobRequest {
  string worker_id = 1;
}

message AssignedJob {
  string  job_id = 1;
  JobSpec spec   = 2;
}

message PollJobResponse {
  oneof result {
    AssignedJob job   = 1;
    Empty       empty = 2;
  }
}

message ReportJobResultRequest {
  string worker_id     = 1;
  string job_id        = 2;
  int32  exit_code     = 3;
  string error_message = 4;
}

message ReportJobResultResponse {
  bool accepted = 1;
}

message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatResponse {
  bool ok = 1;
}

message Empty {}
